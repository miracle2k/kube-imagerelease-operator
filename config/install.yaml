apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: kube-imagerelease-operator
  name: kube-imagerelease-operator-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: imagereleases.kube-imagerelease-operator.nix.re
spec:
  group: kube-imagerelease-operator.nix.re
  names:
    kind: ImageRelease
    listKind: ImageReleaseList
    plural: imagereleases
    shortNames:
    - ir
    singular: imagerelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Resolved image repository
      jsonPath: .status.resolvedImage.image
      name: Image
      type: string
    - description: Resolved immutable digest
      jsonPath: .status.resolvedImage.digest
      name: Digest
      type: string
    - description: Whether the release is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageRelease is a namespaced, durable declaration of the image intended to
          run for a release. Workloads opt in independently through annotations.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired release source.
            properties:
              image:
                description: |-
                  Image is an immutable OCI image reference containing a digest. A tag-only
                  reference is intentionally rejected because releases must be reproducible.
                maxLength: 2048
                pattern: ^.+@sha256:[a-fA-F0-9]{64}$
                type: string
              imagePolicyRef:
                description: |-
                  ImagePolicyRef selects the digest reported by an existing Flux
                  image.toolkit.fluxcd.io/ImagePolicy in this ImageRelease's namespace.
                properties:
                  name:
                    description: Name is the name of the Flux ImagePolicy.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of image or imagePolicyRef must be specified
              rule: (has(self.image) && !has(self.imagePolicyRef)) || (!has(self.image)
                && has(self.imagePolicyRef))
          status:
            description: Status is the controller's observation of the release and
              its targets.
            properties:
              conditions:
                description: |-
                  Conditions communicates source-resolution and target-update state. The
                  controller uses Ready, SourceResolved, and TargetsUpdated condition types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation most recently processed by the
                  controller.
                format: int64
                type: integer
              resolvedImage:
                description: ResolvedImage is the immutable image the controller resolved
                  from spec.
                properties:
                  digest:
                    description: Digest is the immutable digest portion of the resolved
                      image reference.
                    minLength: 1
                    pattern: ^sha256:[a-fA-F0-9]{64}$
                    type: string
                  image:
                    description: Image is the repository portion of the resolved image
                      reference.
                    minLength: 1
                    type: string
                  tag:
                    description: |-
                      Tag is the selected tag, if the source reports one. It is informational;
                      deployments always use Image@Digest.
                    type: string
                required:
                - digest
                - image
                type: object
              workloads:
                description: Workloads lists the subscribed workloads last observed
                  by the controller.
                items:
                  description: |-
                    WorkloadStatus reports the controller's last observation of one subscribed
                    workload. The workload always resides in the ImageRelease's namespace.
                  properties:
                    apiVersion:
                      description: APIVersion is the workload API version, for example
                        apps/v1.
                      minLength: 1
                      type: string
                    container:
                      description: Container is the controlled Kubernetes container
                        name.
                      minLength: 1
                      type: string
                    image:
                      description: Image is the immutable image currently observed
                        on the container.
                      type: string
                    kind:
                      description: Kind is the workload kind, for example Deployment.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the workload name.
                      minLength: 1
                      type: string
                    ready:
                      description: |-
                        Ready reports whether the workload is currently ready according to its
                        native workload status.
                      type: boolean
                  required:
                  - apiVersion
                  - container
                  - kind
                  - name
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - apiVersion
                - kind
                - name
                - container
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-imagerelease-operator-controller-manager
  namespace: kube-imagerelease-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-imagerelease-operator-leader-election-role
  namespace: kube-imagerelease-operator-system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-imagerelease-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - image.toolkit.fluxcd.io
  resources:
  - imagepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kube-imagerelease-operator.nix.re
  resources:
  - imagereleases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kube-imagerelease-operator.nix.re
  resources:
  - imagereleases/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-imagerelease-operator-leader-election-rolebinding
  namespace: kube-imagerelease-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-imagerelease-operator-leader-election-role
subjects:
- kind: ServiceAccount
  name: kube-imagerelease-operator-controller-manager
  namespace: kube-imagerelease-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-imagerelease-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-imagerelease-operator-manager-role
subjects:
- kind: ServiceAccount
  name: kube-imagerelease-operator-controller-manager
  namespace: kube-imagerelease-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: kube-imagerelease-operator
  name: kube-imagerelease-operator-controller-manager
  namespace: kube-imagerelease-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: kube-imagerelease-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: kube-imagerelease-operator
    spec:
      containers:
      - args:
        - --leader-elect=true
        - --leader-election-namespace=kube-imagerelease-operator-system
        - --metrics-bind-address=0
        - --health-probe-bind-address=:8081
        command:
        - /kube-imagerelease-operator
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/miracle2k/kube-imagerelease-operator:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kube-imagerelease-operator-controller-manager
