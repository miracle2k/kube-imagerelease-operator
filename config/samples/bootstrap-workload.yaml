---
# One-time bootstrap only. Replace this digest with the same digest selected by
# ImageRelease/hello-world, then use `kubectl create -f bootstrap-workload.yaml`.
# Never apply this file: after bootstrap, use workloads.yaml, which has no
# image field and therefore cannot roll a later release backward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-web
  namespace: default
  annotations:
    kube-imagerelease-operator.nix.re/image-release: hello-world
    kube-imagerelease-operator.nix.re/image-release-container: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world-web
    spec:
      containers:
        - name: app
          image: ghcr.io/example/hello-world@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
