---
# This consumes a Flux ImagePolicy that already exists in the same namespace.
# kube-imagerelease-operator reads its Ready, observed generation, and latestRef status; it
# does not install Flux resources or scan a registry itself.
apiVersion: kube-imagerelease-operator.nix.re/v1alpha1
kind: ImageRelease
metadata:
  name: hello-world-from-flux
  namespace: default
spec:
  imagePolicyRef:
    name: hello-world
